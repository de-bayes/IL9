{% extends "landing_base.html" %}

{% block meta %}
<title>Unsubscribe - IL9Cast</title>
<meta name="description" content="Unsubscribe from IL9Cast email alerts">
{% endblock %}

{% block content %}
<section class="unsub-page">
    <div class="unsub-card">
        <h1>{% if success %}Unsubscribed{% else %}Error{% endif %}</h1>
        <p class="unsub-message {% if success %}unsub-success{% else %}unsub-error{% endif %}">{{ message }}</p>
        <a href="/" class="btn-primary">Back to IL9Cast</a>
    </div>
</section>
{% endblock %}

{% block page_styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/unsubscribe.css') }}">
{% endblock %}
